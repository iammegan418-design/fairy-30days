<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>仙女團隊｜經營重啟導航</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#C9938A; --soft-pink:#E8C4BC; --light-pink:#F5E6E3;
  --blue:#7A9BAD; --soft-blue:#B8CFDA; --light-blue:#E3EDF3;
  --sage:#9AAE9B; --light-sage:#E8F0E8;
  --cream:#FAF3EE; --bg:#FAFAF8; --dark:#37352F; --medium:#5A5248; --gray:#9B9A97;
  --shadow: 0 4px 20px rgba(55,53,47,0.06);
  --shadow-lg: 0 8px 30px rgba(55,53,47,0.10);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--dark); font-family:"Noto Sans TC",sans-serif; -webkit-font-smoothing:antialiased;}
body{padding-bottom:84px; min-height:100vh;}
h1,h2,h3{margin:0; font-weight:700;}
p{margin:0;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,select,textarea{font-family:inherit; font-size:15px;}
a{text-decoration:none; color:inherit;}

.topbar{position:sticky; top:0; z-index:20; background:rgba(250,243,238,0.92); backdrop-filter:blur(8px); padding:16px 20px 12px; border-bottom:1px solid rgba(55,53,47,0.05);}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.topbar-title{font-size:19px; font-weight:900; letter-spacing:0.5px;}
.topbar-sub{font-size:12px; color:var(--gray); margin-top:2px;}
.icon-btn{width:36px; height:36px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); font-size:16px; flex-shrink:0;}
.partner-switch{display:flex; align-items:center; gap:8px; background:#fff; border-radius:20px; padding:6px 14px 6px 6px; box-shadow:var(--shadow); max-width:100%; overflow:hidden;}
.partner-switch .avatar{width:26px; height:26px; border-radius:50%; background:var(--soft-pink); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; flex-shrink:0;}
.partner-switch select{border:none; background:none; font-weight:700; font-size:14px; color:var(--dark); max-width:140px; text-overflow:ellipsis;}

.container{max-width:520px; margin:0 auto; padding:18px 20px 30px;}

.card{background:#fff; border-radius:22px; padding:20px; box-shadow:var(--shadow); margin-bottom:14px;}
.card + .card{margin-top:0;}
.card-tight{padding:16px 18px;}
.section-label{font-size:12px; color:var(--gray); font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:8px;}

.hero-card{background:linear-gradient(135deg, var(--light-pink), var(--light-blue)); border-radius:26px; padding:26px 22px; margin-bottom:16px;}
.hero-eyebrow{font-size:12px; font-weight:700; color:var(--pink); letter-spacing:1px; margin-bottom:6px;}
.hero-title{font-size:22px; font-weight:900; line-height:1.5; color:var(--dark);}
.hero-desc{font-size:13.5px; color:var(--medium); margin-top:8px; line-height:1.7;}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
.stat-card{background:#fff; border-radius:18px; padding:16px; box-shadow:var(--shadow);}
.stat-num{font-size:26px; font-weight:900; color:var(--pink);}
.stat-label{font-size:12px; color:var(--gray); margin-top:4px;}

.pill{display:inline-block; padding:5px 13px; border-radius:20px; font-size:12px; font-weight:700;}
.pill-pink{background:var(--light-pink); color:var(--pink);}
.pill-blue{background:var(--light-blue); color:var(--blue);}
.pill-sage{background:var(--light-sage); color:#5c7a5d;}
.pill-gray{background:#F1F0ED; color:var(--gray);}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:13px 20px; border-radius:16px; font-size:14.5px; font-weight:700; width:100%; transition:transform .1s ease;}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--pink); color:#fff;}
.btn-secondary{background:#fff; color:var(--dark); box-shadow:var(--shadow);}
.btn-soft{background:var(--light-pink); color:var(--pink);}
.btn-outline{background:transparent; border:1.5px solid var(--soft-pink); color:var(--pink);}
.btn-sm{width:auto; padding:8px 16px; font-size:13px; border-radius:12px;}
.btn-block-row{display:flex; gap:10px;}
.btn-block-row .btn{flex:1;}

.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:700; color:var(--medium); margin-bottom:7px;}
.field .hint{font-size:11.5px; color:var(--gray); margin-top:5px; line-height:1.5;}
.field input[type=text], .field input[type=number], .field input[type=date], .field textarea, .field select{
  width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid #ECE7E1; background:var(--cream); color:var(--dark); outline:none;
}
.field textarea{resize:vertical; min-height:70px; line-height:1.6;}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--soft-pink);}
.radio-group{display:flex; flex-wrap:wrap; gap:8px;}
.radio-chip{padding:10px 14px; border-radius:14px; background:var(--cream); border:1.5px solid #ECE7E1; font-size:13.5px; color:var(--medium); font-weight:500;}
.radio-chip.active{background:var(--pink); border-color:var(--pink); color:#fff; font-weight:700;}

.progress-track{width:100%; height:8px; background:#F1EDE7; border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--soft-pink), var(--pink)); border-radius:6px; transition:width .4s ease;}

.task-item{display:flex; align-items:flex-start; gap:12px; padding:14px 0; border-bottom:1px solid #F3EFE9;}
.task-item:last-child{border-bottom:none;}
.task-check{width:24px; height:24px; border-radius:50%; border:2px solid var(--soft-pink); flex-shrink:0; display:flex; align-items:center; justify-content:center; margin-top:1px; font-size:13px; color:#fff;}
.task-check.done{background:var(--pink); border-color:var(--pink);}
.task-text{font-size:14.5px; line-height:1.6; flex:1;}
.task-text.done{color:var(--gray); text-decoration:line-through;}
.task-tag{font-size:11px; color:var(--gray); margin-top:3px;}

.wizard-steps{display:flex; gap:5px; margin-bottom:18px;}
.wizard-dot{flex:1; height:5px; border-radius:4px; background:#EEE7E1;}
.wizard-dot.active{background:var(--pink);}
.wizard-dot.filled{background:var(--soft-pink);}

.empty-state{text-align:center; padding:50px 20px;}
.empty-state .emoji{font-size:40px; margin-bottom:12px;}
.empty-state h3{font-size:17px; margin-bottom:8px;}
.empty-state p{font-size:13.5px; color:var(--gray); line-height:1.7; margin-bottom:18px;}

.list-item{display:flex; align-items:center; gap:12px; padding:14px; background:#fff; border-radius:18px; box-shadow:var(--shadow); margin-bottom:10px;}
.list-item .avatar{width:44px; height:44px; border-radius:50%; background:var(--soft-blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0;}
.list-item-body{flex:1; min-width:0;}
.list-item-name{font-size:15px; font-weight:700;}
.list-item-meta{font-size:12px; color:var(--gray); margin-top:3px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.list-item-chevron{color:var(--gray); font-size:18px;}

.search-bar{display:flex; align-items:center; gap:8px; background:#fff; border-radius:16px; padding:12px 16px; box-shadow:var(--shadow); margin-bottom:12px;}
.search-bar input{border:none; background:none; outline:none; flex:1; font-size:14px;}
.filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{flex-shrink:0; padding:8px 14px; border-radius:14px; background:#fff; box-shadow:var(--shadow); font-size:12.5px; font-weight:700; color:var(--medium);}
.filter-chip.active{background:var(--dark); color:#fff;}

.day-chip-row{display:flex; overflow-x:auto; gap:6px; padding:4px 0 10px; margin:0 -4px 8px;}
.day-chip-row::-webkit-scrollbar{display:none;}
.day-chip{flex-shrink:0; width:38px; height:38px; border-radius:12px; background:#fff; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--gray);}
.day-chip.today{background:var(--pink); color:#fff;}
.day-chip.done{background:var(--light-sage); color:#5c7a5d;}

.retro-block{background:var(--light-blue); border-radius:18px; padding:16px; margin-bottom:12px;}
.retro-block h4{font-size:13px; color:var(--blue); margin-bottom:6px;}
.retro-block p{font-size:13.5px; line-height:1.7; color:var(--dark);}

.bottom-nav{position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,0.97); backdrop-filter:blur(10px); border-top:1px solid #F0EBE5; display:flex; z-index:30; padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
.nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border-radius:12px; color:var(--gray); font-size:10.5px; font-weight:600;}
.nav-btn.active{color:var(--pink);}
.nav-btn .nav-icon{font-size:19px;}

.tab-row{display:flex; gap:6px; overflow-x:auto; margin-bottom:16px; padding-bottom:2px;}
.tab-row::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0; padding:9px 14px; border-radius:13px; background:#fff; box-shadow:var(--shadow); font-size:12.5px; font-weight:700; color:var(--medium);}
.tab-btn.active{background:var(--dark); color:#fff;}

.toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--dark); color:#fff; padding:11px 22px; border-radius:30px; font-size:13px; font-weight:600; z-index:99; box-shadow:var(--shadow-lg); opacity:0; transition:opacity .25s ease; pointer-events:none;}
.toast.show{opacity:1;}

.mood-row{display:flex; justify-content:space-between; gap:6px;}
.mood-btn{flex:1; padding:12px 4px; border-radius:14px; background:var(--cream); text-align:center; font-size:22px; border:2px solid transparent;}
.mood-btn.active{border-color:var(--pink); background:var(--light-pink);}
.mood-btn .mood-label{display:block; font-size:10px; margin-top:4px; color:var(--gray); font-weight:600;}

.divider{height:1px; background:#F2EDE7; margin:16px 0;}
.small-note{font-size:12px; color:var(--gray); line-height:1.7;}
.link-btn{color:var(--pink); font-size:13px; font-weight:700;}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ===================== 資料層 ===================== */
const STORAGE_KEY = 'jerosse_partners_v1';
let state = { partners: [], currentId: null, loaded: false };

function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* 儲存層：優先使用 Claude 內建雲端儲存，若不可用（例如放到 GitHub Pages 或一般瀏覽器）
   則自動改用 localStorage，兩邊都會盡量寫入，確保資料不會因環境不同而遺失或報錯 */
async function storageGetRaw(key){
  if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get==='function'){
    try{ const r = await window.storage.get(key); if(r && typeof r.value==='string') return r.value; }catch(e){}
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSetRaw(key, value){
  let ok=false;
  if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set==='function'){
    try{ await window.storage.set(key, value); ok=true; }catch(e){}
  }
  try{ localStorage.setItem(key, value); ok=true; }catch(e){}
  return ok;
}
/* 舊版 healthCheck 可能缺少 tiedWeakest／maxScore／focus／secondary／weakest 等新欄位，
   這裡只補缺少的欄位，絕對不覆蓋或清除使用者原本已存在的資料（stage/primaryLabel/primaryBody等維持原樣）。 */
function normalizeHealthCheck(hc){
  if(!hc || typeof hc!=='object') return hc;
  if(!Array.isArray(hc.weakest)) hc.weakest = Array.isArray(hc.focus) ? hc.focus.slice(0,3) : DIM_ORDER.slice(0,3);
  if(!hc.scores || typeof hc.scores!=='object') hc.scores = {};
  if(hc.maxScore===undefined || hc.maxScore===null){
    const scoreValues = Object.values(hc.scores);
    hc.maxScore = scoreValues.length ? Math.max(...scoreValues) : 0;
  }
  if(!Array.isArray(hc.tiedWeakest)){
    hc.tiedWeakest = DIM_ORDER.filter(k => (hc.scores||{})[k] === hc.maxScore);
  }
  if(!Array.isArray(hc.secondary)) hc.secondary = hc.weakest.slice(1,3).map(d=>DIM_FOCUS_LABEL[d]).filter(Boolean);
  if(!Array.isArray(hc.focus)) hc.focus = hc.weakest.map(d=>DIM_FOCUS_LABEL[d]).filter(Boolean);
  return hc;
}
async function loadData(){
  const raw = await storageGetRaw(STORAGE_KEY);
  try{ state.partners = raw ? JSON.parse(raw) : []; }catch(e){ state.partners = []; }
  state.partners.forEach(p=>{ if(p && p.healthCheck) normalizeHealthCheck(p.healthCheck); });
  const cid = await storageGetRaw('jerosse_current_id');
  state.currentId = cid || null;
  state.loaded = true;
}
async function saveData(){
  const ok = await storageSetRaw(STORAGE_KEY, JSON.stringify(state.partners));
  if(!ok) showToast('儲存失敗，請稍後再試');
}
async function saveCurrentId(id){
  state.currentId = id;
  await storageSetRaw('jerosse_current_id', id || '');
}
function normalizePositioning(pos){
  if(!pos || typeof pos !== 'object') return pos;

  if(!Array.isArray(pos.pillars)) pos.pillars = [];
  if(!Array.isArray(pos.topics)) pos.topics = [];
  if(!Array.isArray(pos.contentDirections)) pos.contentDirections = [];

  if(!Array.isArray(pos.shareStyleLines)){
    pos.shareStyleLines = [
      '你不用刻意把自己變成老師，也不用每天講產品。',
      '先從自己的生活、改變和實際經驗開始分享就好。'
    ];
  }

  if(typeof pos.label !== 'string') pos.label = '真實生活分享型';
  if(typeof pos.traitsLine !== 'string') pos.traitsLine = '真誠 × 努力';
  if(typeof pos.expressionStyle !== 'string'){
    pos.expressionStyle = '用你自己說話的方式分享就好，反而最真實。';
  }

  return pos;
}
function normalizePlanRecord(plan){
  if(!plan || typeof plan !== 'object') return plan;
  if(!Array.isArray(plan.weeks)) plan.weeks = [];
  if(!Array.isArray(plan.flat)) plan.flat = [];
  return plan;
}
function normalizePartnerRecord(p){
  if(!p) return p;
  if(!p.daily || typeof p.daily!=='object') p.daily = {};
  if(!Array.isArray(p.weeklyRetros)) p.weeklyRetros = [];
  if(!p.weekAdjustments || typeof p.weekAdjustments!=='object') p.weekAdjustments = {};
  if(p.positioning) normalizePositioning(p.positioning);
  if(p.healthCheck) normalizeHealthCheck(p.healthCheck);
  if(p.plan) normalizePlanRecord(p.plan);
  return p;
}
function getPartner(id){ return normalizePartnerRecord(state.partners.find(p=>p.id===id)); }
function currentPartner(){ return getPartner(state.currentId); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ===================== 日期工具 ===================== */
function localDateStr(date = new Date()){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function todayStr(){ return localDateStr(); }
function dayNumber(startDate){
  const s = new Date(startDate+'T00:00:00'); const t = new Date(todayStr()+'T00:00:00');
  const diff = Math.floor((t-s)/86400000)+1;
  return Math.max(1, Math.min(30, diff));
}
function dateOfDay(startDate, n){
  const s = new Date(startDate+'T00:00:00'); s.setDate(s.getDate()+(n-1));
  return localDateStr(s);
}
function fmtDate(d){ const dt=new Date(d+'T00:00:00'); return `${dt.getMonth()+1}/${dt.getDate()}`; }
function dayVisited(rec){
  if(!rec) return false;
  if(rec.visited) return true;
  return !!(rec.tasksDone && rec.tasksDone.some(x=>x));
}

/* ===================== 經營健檢邏輯 ===================== */
const STAGE_EMOJI = {'重啟期':'🌱','建立期':'🌿','成長期':'🌸','互動期':'🍀','轉換期':'🌟','穩定期':'✨'};
const STAGE_INFO = {
  '重啟期': {
    why:'你現在會覺得卡住，不是因為不夠努力，而是這段時間可能有點忙、有點累，經營的節奏被打斷了。這很正常，先不用給自己太多壓力，現在最重要的是重新開始。'
  },
  '建立期': {
    why:'你已經有在經營，只是還沒有找到穩定的節奏，常常斷斷續續。這個階段不需要學太多新技巧，先把節奏建立起來就好。'
  },
  '成長期': {
    why:'你已經有一定的曝光與內容基礎，方向是對的。接下來需要突破的，是怎麼讓更多人願意主動開口詢問你。'
  },
  '互動期': {
    why:'你已經開始有人詢問，這是很好的進展。現在的重點，是把詢問延續成真正的對話，慢慢建立信任，而不是急著成交。'
  },
  '轉換期': {
    why:'你已經能把對話推進到成交，這不容易。接下來的重點，是把買過的客人留住，讓關係可以延續下去，而不只是做一次生意。'
  },
  '穩定期': {
    why:'你已經有穩定的經營節奏與成交，很不容易。接下來的重點，不是逼自己做更多新事情，而是優化現有的做法，並把成果放大。'
  }
};

/* 依 STEP3 六個客觀面向判斷各環節分數（0=強，3=弱），保留各面向分數，供找出最弱前三項使用 */
const WEAKNESS_SCORES = {
  exposure: {'0天':3,'1～2天':2,'3～4天':1,'5天以上':0},
  inquiry: {'0人':3,'1～3人':2,'4～10人':1,'10人以上':0},
  closing: {'常常不知道怎麼接話':3,'聊得下去但不太會收單':2,'偶爾能成交':1,'大多知道怎麼推進':0},
  positioning: {'完全不清楚':3,'有一點':2,'算清楚':1,'很清楚':0},
  content: {'常常不知道':3,'想很久才發':2,'大概有方向':1,'有固定內容方向':0},
  followUp: {'幾乎沒有':3,'想到才做':2,'偶爾會':1,'有固定回訪':0}
};
const DIM_ORDER = ['exposure','positioning','content','inquiry','closing','followUp'];
const DIM_FOCUS_LABEL = {
  exposure:'建立穩定曝光', positioning:'讓別人更快認識你', content:'找到自己的內容方向',
  inquiry:'累積讓人主動詢問的信任感', closing:'練習自然的成交邀請', followUp:'建立客戶回訪的習慣'
};
const DIM_TASK = {
  exposure:'完成 2～3 次簡單曝光（一句話或一張照片都算）',
  positioning:'發一則簡單的自我介紹，讓人知道你在分享什麼',
  content:'把你的內容方向想清楚，先不用真的發文',
  inquiry:'分享一則真實的心得或故事，讓人更認識你',
  closing:'主動關心一位曾經詢問過的人，練習自然聊下去',
  followUp:'主動回覆或問候 3 位曾經跟你互動過的人'
};

function computeWeakness(b){
  const scores = {};
  DIM_ORDER.forEach(k=>{ scores[k] = (WEAKNESS_SCORES[k]||{})[b[k]]; if(scores[k]===undefined) scores[k]=0; });
  const weakest = DIM_ORDER.slice().sort((a,c)=>scores[c]-scores[a]).slice(0,3);
  const maxScore = Math.max(...Object.values(scores));
  const tiedWeakest = DIM_ORDER.filter(k => scores[k] === maxScore);
  return {scores, weakest, tiedWeakest, maxScore};
}

/* 根據最弱環節組成一段診斷文字；如果有兩項以上同分並列最弱，不假裝只有唯一原因 */
function composeDiagnosis(weakest, scores, tiedWeakest){
  if(tiedWeakest && tiedWeakest.length>=2){
    const labels = tiedWeakest.map(k=>DIM_FOCUS_LABEL[k]);
    return `從你目前的回答看，現在比較明顯的卡點不只一個，「${labels.join('」和「')}」目前同時偏弱，可以先從這幾個地方一起觀察看看。`;
  }
  const top = weakest[0];
  if(top==='closing' && (weakest.includes('exposure') || weakest.includes('content'))){
    return '從你目前的回答看，可能不是成交能力不好，而是前端曝光與內容還沒有穩定，新客人進來的機會也會跟著變少。目前比較值得先觀察的，是曝光與內容的節奏。';
  }
  const map = {
    exposure: '從你目前的回答看，曝光頻率是比較明顯的弱項之一。曝光偏少時，新機會通常也會跟著變少，這會是目前值得先觀察的地方。',
    positioning: '從目前的回答看，你可能不是缺少行動，而是定位還沒有完全清楚。當別人不容易快速理解你在分享什麼時，內容與互動通常也會變得比較吃力。',
    content: '從你目前的回答看，內容方向還不太固定，可能是目前經營容易斷斷續續的原因之一。先建立幾個固定方向，分享起來可能會比較輕鬆。',
    inquiry: '從你目前的回答看，曝光跟內容都已經有基礎，比較值得注意的是信任感的累積，這可能會影響到主動詢問的意願。',

    followUp: '從你目前的回答看，曝光與成交都還不錯，比較容易被忽略的可能是舊客戶的回訪與關係經營，這部分建立一個簡單的習慣，通常會慢慢看到差異。'
  };
  return map[top] || '你目前的經營還在慢慢累積，不用急，可以先從比較容易卡住的地方一項一項觀察看看。';

function composePrimaryDiagnosis(m, weakest, scores, timeLevel, tiedWeakest){
  const timeLimited = timeLevel<=1;
  const inCrisis = m.feeling==='有點想放棄' || m.feeling==='不知道自己在忙什麼' || m.feeling==='很挫折';
  const noFeedback = weakest.slice(0,2).some(d=>d==='inquiry'||d==='exposure');
  const noDirection = weakest.slice(0,2).some(d=>d==='content'||d==='positioning');
  const cantOpen = (m.blockers||[]).includes('不敢開口分享') || (m.blockers||[]).includes('不會跟進客人') || weakest.slice(0,2).includes('closing');

  if(tiedWeakest && tiedWeakest.length>=2 && !inCrisis){
    const labels = tiedWeakest.map(k=>DIM_FOCUS_LABEL[k]);
    return {
      label: '目前比較明顯的卡點不只一個。',
      body: `從你目前的回答看，「${labels.join('」和「')}」目前同時偏弱，可能是同時影響你經營節奏的地方。不用急著一次全部處理，可以先從其中一個開始觀察看看。`
    };
  }

  if(inCrisis || weakest[0]==='exposure'){
    const reasons = [];
    if(timeLimited) reasons.push('現在能投入的時間有限');
    if(noFeedback) reasons.push('一段時間沒有得到詢問或回饋');
    let body = reasons.length
      ? `從你目前的回答看，可能是${reasons.join('，加上')}，這些疊在一起，久了容易讓人不太確定每天該做什麼`
      : '從你目前的回答看，這段時間的節奏可能被打斷了';
    if(noDirection) body += '，也可能不太確定要分享什麼';
    if(cantOpen) body += '，也可能比較不想主動開口';
    body += '。這些都只是目前看起來比較可能的原因，不用一次解決所有問題，可以先重新建立一個做得到、也能持續的經營節奏。';
    return {label:'經營節奏可能被打斷了。', body};
  }
  if(noDirection){
    return {label:'方向可能還沒有完全定下來。', body:'從目前的回答看，你不是沒有內容，而是可能還沒有一個清楚、可以一直分享下去的方向，所以每次要發文都要重新想。先把方向定下來，之後可能會輕鬆一些。'};
  }
  if(cantOpen){
    return {label:'互動與跟進可能還沒有形成習慣。', body:'從目前的回答看，你已經有基礎，比較可能的是還沒有養成主動關心、跟進的習慣，機會可能因此被錯過。這部分建立一個簡單的節奏，通常會慢慢看到改變。'};
  }
  return {label:'整體看起來還算穩定，有幾個地方可以再加強。', body:'從目前的回答看，你的經營已經有一定基礎，接下來把幾個比較弱的環節慢慢補起來，可能會更完整。'};
}

function computeHealthCheck(m, b, dailyTime){
  const {scores, weakest, tiedWeakest, maxScore} = computeWeakness(b);
  const timeLevel = Math.max(0, TIME_LEVELS.indexOf(dailyTime));
  let stage;
  // 經營階段只依 STEP3 六個客觀經營面向判斷，不受「今天心情」影響；心情只影響今天任務份量與語氣（見 MOOD_TIERS）
  if(scores.exposure>=3){
    stage='重啟期';
  }
  // 六項都很強、沒有真正弱項 → 穩定期
  else if(scores[weakest[0]]===0){
    stage='穩定期';
  }
  // 其餘：依「目前最弱的那一個環節」直接對應到該環節所屬的階段，不寫死、不用籠統平均值
  else {
    const STAGE_BY_WEAKEST = {
      exposure:'重啟期', positioning:'建立期', content:'建立期',
      inquiry:'成長期', closing:'互動期', followUp:'轉換期'
    };
    stage = STAGE_BY_WEAKEST[weakest[0]] || '建立期';
  }
  let primary, secondary, focus;
  if(scores[weakest[0]]===0){
    // 六項都很強，沒有真正的弱項，不要硬套一個假卡點
    primary = {label:'整體已經很穩定了。', body:'你目前六個面向都算穩定，很不容易。接下來的重點，不是找出弱點來補強，而是把已經做得好的地方持續放大，並且讓經營變得更輕鬆。'};
    secondary = ['加強老客戶的關係與回購','建立可以持續複製的節奏'];
    focus = ['把有效的做法固定下來','加強老客戶的關係與回購','建立可以持續複製的節奏'];
  } else {
    primary = composePrimaryDiagnosis(m, weakest, scores, timeLevel, tiedWeakest);
    secondary = weakest.slice(1,3).map(d=>DIM_FOCUS_LABEL[d]);
    focus = weakest.map(d=>DIM_FOCUS_LABEL[d]);
  }
  const info = STAGE_INFO[stage];
  return {
    stage, emoji: STAGE_EMOJI[stage],
    why: info.why,
    primaryLabel: primary.label, primaryBody: primary.body,
    blocker: primary.body,
    secondary, focus, weakest, scores, tiedWeakest, maxScore,
    checkedDate: todayStr()
  };
}

/* ===================== 內容助手：把生活變成內容 ===================== */
function classifyEvent(text){
  const t = (text||'').trim();
  const has = (arr)=>arr.some(k=>t.includes(k));
  if(!t || has(['沒有靈感','沒靈感','不知道要發什麼','沒有想法','沒想法'])) return 'blank';
  if(has(['沒什麼特別的事','沒什麼特別','很平凡','普通的一天'])) return 'ordinary';
  if(has(['沒動力','不想做','好累','很累','疲憊','壓力大','想放棄','emo','低潮','沒信心'])) return 'mindset';
  if(has(['客人問','有人問','問我產品','問價','怎麼吃','怎麼用','詢問'])) return 'question';
  if(has(['收到產品','收到貨','收到包裹','包裹到','到貨','開箱'])) return 'received';
  if(has(['使用產品','使用心得','用起來','用完','體驗','效果'])) return 'used';
  return 'life';
}

/* 判斷「今天這件事」本身屬於哪一種類別，決定要不要連結到身分（不是每件事都要硬套定位） */
function classifyEventCategory(text){
  const t = (text||'').trim();
  const has = (arr)=>arr.some(k=>t.includes(k));
  if(has(['叫了','訂了','買了','下單','訂購','購買','要了'])) return 'order';
  if(has(['累','emo','沒動力','低潮','煩','難過','開心','感動','想放棄'])) return 'emotion';
  if(has(['小孩','孩子','接送','上課','育兒','餵奶','親子','小朋友'])) return 'family';
  if(has(['上班','主管','同事','會議','加班','老闆','公司','客戶會議'])) return 'work';
  if(has(['客人問','有人問','私訊','留言問','詢問我','問我'])) return 'customer';
  if(has(['產品','使用','擦','敷','效果','心得','體驗'])) return 'product';
  if(has(['學到','學習','上課程','看書','成長','領悟'])) return 'growth';
  if(has(['發文','分享','經營','限動','貼文','曝光'])) return 'business_log';
  return 'daily';
}
/* 短、平淡、生活慣性動作（洗臉、喝咖啡…）：資訊量太低，不該硬套內容，先問一句或給「不用硬發」的選項 */
function isLowSignalEvent(text){
  const t = (text||'').trim();
  if(!t) return false;
  const core = t.replace(/^今天/,'').replace(/^有/,'').trim();
  const mundane = ['洗臉','刷牙','洗澡','喝咖啡','喝水','吃早餐','吃午餐','吃晚餐','洗頭','出門','回家','睡覺','午睡'];
  if(mundane.some(k=>core===k || core.includes(k))) return core.length<=8;
  return t.length>0 && t.length<=5;
}

    weakest: (p.healthCheck && p.healthCheck.weakest||[])[0] || null,
    need: (p.step2 && p.step2.need) || '',
    expressionStyle: pos.expressionStyle || '',
    lifeRole, job, sharingTags, traits,
    hasFamilyIdentity: /媽媽|孕|育兒/.test(lifeRole) || sharingTags.includes('家庭育兒') || audienceList.some(a=>/媽媽/.test(a)),
    hasWorkIdentity: /上班族|自營商|創業/.test(job) || sharingTags.includes('上班生活') || sharingTags.includes('工作事業')
  };
}

function generateAssistantResult(p, event, forcedAngle){
  const angle = forcedAngle || classifyEvent(event);
  const ctx = buildAssistantContext(p, event);
  const tpl = (ASSISTANT_TEMPLATES[angle] || ASSISTANT_TEMPLATES.life)(ctx);
  tpl.expressionStyle = ctx.expressionStyle;
  return tpl;
}

function hasProductSignal(event){ return /產品|使用|擦|敷|效果|心得|保養|保健|試用/.test(event||''); }
function hasKnowledgeSignal(event, category){
  if(['work','growth','product','business_log'].includes(category)) return true;
  if(category==='family' || category==='emotion') return false;
  return /技巧|方法|流程|訣竅|小撇步|順序/.test(event||'');
}
function stripLeader(event){ return (event||'').replace(/^今天/,'').replace(/^剛剛|^剛才/,'').replace(/^有/,'').trim() || event; }
/* 判斷是不是只有「交易事實」而沒有任何體驗／情境細節（例如「有人跟我買產品」只是事實，沒有感受、原因、是否回購等資訊） */
function hasStoryDetail(event){
  return /很好|很棒|說|回購|又來|終於|感覺|覺得|效果|改善|變好|開心|感動|信任|喜歡|滿意|第一次|之前|再買|再訂|主動|聊到|聊天/.test(event||'');
}
function buildNeutralTransactionVariants(event, restItems){
  const companion = (restItems && restItems.length) ? restItems[0] : null;
  return [
    {label:'最自然', text:`今天工作中又完成了一件小事 🤍`},
    {label:'有共鳴', text: companion ? `今天除了${companion}，也默默處理了一件工作上的事。` : `今天除了平常的生活，也默默處理了一件工作上的事。`},
    {label:'有互動', text:`你們比較喜歡我分享工作日常，還是生活日常？`}
  ];
}

function identityLeadIn(category, ctx){

function judgeProductAdvice(event, category){
  if(TRANSACTIONAL_CATEGORIES.includes(category) || hasProductSignal(event)){
    return {level:'natural', text:'這則很適合自然帶到，不用刻意介紹功效，用聊天的口吻說就好。'};

/* 先判斷素材類型（普通生活／情緒／故事／產品／工作／家庭），再從適合這個類型的角度池挑選——
   不是抽到角度再硬把素材塞進去。文字只用使用者實際提供的內容，不捏造原因、心情或經過。 */
function classifyMaterialType(event){
  const category = classifyEventCategory(event);
  if(TRANSACTIONAL_CATEGORIES.includes(category)) return 'product';
  if(category==='family') return 'family';
  if(category==='work' || category==='business_log') return 'work';
  if(category==='emotion') return 'emotion';
  if(category==='growth') return 'story';
  if(/以前.{0,12}(不敢|沒有|不會|很少|不太)|現在.{0,12}(終於|開始|會|已經|敢)/.test(event||'')) return 'story';
  return 'daily';
}
const MATERIAL_ANGLE_POOL = {

function reactionFor(voice){ const set = REACTION_SETS[voice]||REACTION_SETS.plain; return set[regenPass % set.length]; }
const ANGLE_DEFS = {
  daily: {label:'就發日常', compose:(core,voice)=> `${core} ${reactionFor(voice)}`},

let usedAngleKeys = new Set();
function pickThreeAngleKeys(event){
  const pool0 = MATERIAL_ANGLE_POOL[classifyMaterialType(event)] || MATERIAL_ANGLE_POOL.daily;
  let pool = pool0.filter(k=>!usedAngleKeys.has(k));
  if(pool.length<3){ usedAngleKeys.clear(); pool = pool0; }
  const shuffled = pool.slice().sort(()=>Math.random()-0.5);
  const picked = shuffled.slice(0, Math.min(3, pool0.length));
  picked.forEach(k=>usedAngleKeys.add(k));
  return picked;
}
function composeAngleSet(event, ctx, keys){
  const category = classifyEventCategory(event);
  const voice = primaryVoice(ctx.traits);
  const core = stripLeader(event);
  const productAdv = judgeProductAdvice(event, category);
  const scene = CATEGORY_SCENE[category] || CATEGORY_SCENE.daily;
  return keys.map(k=>{
    const def = ANGLE_DEFS[k];
    const text = def.compose(core, voice);
    const isQ = (k==='qa' || k==='resonance');
    return {
      key:k, label:def.label, text,
      format: isQ ? '限時動態或貼文' : '限時動態',
      scene,
      interaction: isQ ? {level:'question', text:'可以留言區引導大家回覆。'} : {level:'none', text:'今天不用互動，單純分享就好。'},

/* STEP A｜先理解，不直接寫文案：把「洗臉了 用了洗卸 超好用」這種多子句輸入，
   拆成「事件」＋「動作/產品」＋「感受」，內部使用，不顯示在畫面上。 */
const FEELING_WORDS = ['超好用','很好用','好用','不錯','舒服','喜歡','很棒','很讚','棒','讚','滿意','很有感','有感','很乾淨','乾淨','清爽','方便','順手','好吃','好喝','好聽','好看','療癒','可以','還可以','沒問題'];

function reflowEvent(text){

  const product = PRODUCT_WORDS.find(p=>text.includes(p));
  if(!product) return null;
  if(/洗/.test(text) && /臉/.test(text)) return `用了${product}洗臉`;
  if(/擦/.test(text) && /臉/.test(text)) return `用了${product}擦臉`;
  if(/敷/.test(text) && /臉/.test(text)) return `敷了${product}`;
  if(/洗/.test(text)) return `用了${product}洗`;
  return `用了${product}`;
}
function parseMaterial(event){
  let clauses = event.split(/[\s,，、。！]+/).map(s=>s.trim()).filter(Boolean);
  let trait = '';
  const traitIdx = clauses.findIndex(c=>TRAIT_WORDS.some(t=>c.includes(t)));
  if(traitIdx>=0){
    trait = TRAIT_WORDS.find(t=>clauses[traitIdx].includes(t));
    // 膚質／體質這類「自身條件」單獨拉出來，不混進事件/動作/感受判斷，避免把「我是敏感肌」誤判成事件本身
    clauses = clauses.filter((_,i)=>i!==traitIdx);
    const restRaw = clauses.join('，').replace(/^但|^不過/,'').trim();
    const rest = cleanCore(restRaw) || restRaw || event;

  }
  if(clauses.length===1 && clauses[0].length>10){
    // 單一長句、沒有自然斷點時，不要用字串代換硬抽感受詞（會從句子中間挖字，破壞語意），整句保留當事件
    const whole = cleanCore(clauses[0]) || clauses[0];
    return { mainEvent: whole, action:'', feeling:'', hasChoice:false, trait:'' };
  }
  let feeling = '', actionClause = '';
  const eventClauses = [];
  for(let i=0;i<clauses.length;i++){
    const c = clauses[i];
    if(!feeling){
      const fw = FEELING_WORDS.find(f=>c.includes(f));
      if(fw){
        feeling = fw;
        const remainderRaw = c.replace(fw,'').replace(/(很|超|太|非常|滿|挺|真的)$/,'').replace(/覺得$|感覺$/,'').trim();
        const remainder = cleanCore(remainderRaw);
        if(remainder && !INTENSIFIER_ONLY.test(remainder) && !GENERIC_COMPLETION_ONLY.test(remainder)){
          // 動作跟感受詞同一句，扣掉感受詞跟語助詞後還有實質內容才當動作，避免留下「洗完」這種跟事件重複的空詞
          actionClause = remainder;
        } else if(eventClauses.length){
          // 感受詞自己獨立成一句（或只剩語助詞）時，動作/產品通常在前一句，把它取出來當動作
          actionClause = cleanCore(eventClauses.pop());
        }
        continue;
      }
    }
    eventClauses.push(c);
  }
  let mainEventRaw = eventClauses.length ? eventClauses.join('，') : (actionClause || clauses[0] || event);
  let mainEvent = cleanCore(mainEventRaw) || mainEventRaw;
  if(mainEvent.length<2) mainEvent = cleanCore(event) || event; // 太短的片段不夠自然，退回整句
  const reflowedEvent = reflowEvent(mainEvent); // 語序不通順時整理成正常口語，不新增內容

  if(actionClause){

    if(reflowedAction) actionClause = reflowedAction;

  if(actionClause === mainEvent) actionClause = ''; // 動作跟事件重複時不用硬塞兩次
  const hasChoice = /還是|或是|或者/.test(event); // 只有輸入裡真的出現兩個以上選項時，才適合問「你們選哪個」
  return { mainEvent, action: actionClause, feeling, hasChoice, trait:'' };
}

let usedTopicSetIdx = {};
function pickTopicSet(moduleId, sets){
  if(!usedTopicSetIdx[moduleId]) usedTopicSetIdx[moduleId] = new Set();
  const used = usedTopicSetIdx[moduleId];
  let idx = sets.findIndex((s,i)=>!used.has(i));
  if(idx===-1){ used.clear(); idx=0; }
  used.add(idx);
  return sets[idx];
}
/* 「習慣 ＋ 我們家／自己家 產品提及」這種輸入，原本會落到最弱的備用邏輯（整句包起來加語助詞）。
   這裡動態抽出「習慣」跟「她自己講的產品描述」，組成三個結構真正不同的反思型內容，
   只使用她自己說過的話，不额外編造成分、熱量、功效等她沒提供的具體事實。 */
function extractOwnProductPattern(event){
  const m = event.match(/我們家|自己家|我家/);
  if(!m) return null;
  const idx = event.indexOf(m[0]);
  const habitRaw = event.slice(0, idx).trim();
  const habit = cleanCore(habitRaw) || habitRaw;
  const claim = cleanCore(event.slice(idx).trim()) || event.slice(idx).trim();
  if(!habit) return null;
  return { habit, claim };
}

  if(topicModule){

    usedDay1Texts.add(set.personal); usedDay1Texts.add(set.resonance);

      return { picked:[buckets.daily[d.i], buckets.emotion[e.i], buckets.interactive[i.i]], idx:{daily:d.i, emotion:e.i, interactive:i.i} };

      // 主題模式：短短的主題，主動設計3個分享切角，而不是原地打轉
      const buckets = buildTopicBuckets(core);
      const d = drawOneFromBucket(buckets.daily, 'daily');
      const e = drawOneFromBucket(buckets.emotion, 'emotion');
      const i = drawOneFromBucket(buckets.interactive, 'interactive');
      return { picked:[buckets.daily[d.i], buckets.emotion[e.i], buckets.interactive[i.i]], idx:{daily:d.i, emotion:e.i, interactive:i.i} };
    }
    const pool = day1TemplatePool(category).map(t=>({angle:t.key, text: t.compose(core)}));

    return { picked: shuffled.slice(0,3), idx:null };
  };

function runContentAssistant(pid, event){
  console.log('[Assistant] generating for input:', event);
  try{
    const p = getPartner(pid);
    assistantPendingEvent = event;
    const ctx = buildAssistantContext(p, event);
    const category = classifyEventCategory(event);
    if(isDay1(p)){
      usedDay1Texts = new Set();
      usedDay1BucketIdx = {daily:new Set(), emotion:new Set(), interactive:new Set()};
      usedTopicSetIdx = {};
      const templates = pickDay1Templates(event, p);
      const angles = composeDay1AngleSet(templates);

      document.getElementById('assistantResult').innerHTML = renderThreeAngles(ctx, angles, '今天只要願意重新發一則，就已經很足夠了。');
      console.log('[Assistant] render complete');
      return;
    }
    if(/不知道.{0,4}發什麼|沒靈感|沒想法|不知道要發什麼|沒什麼好發/.test(event)){
      showNoInspiration(pid);
      console.log('[Assistant] render complete (no-inspiration branch)');
      return;
    }
    if(TRANSACTIONAL_CATEGORIES.includes(category) && !hasStoryDetail(event)){

      assistantPendingRest = [];
      document.getElementById('assistantResult').innerHTML = renderNeedsInfoPrompt(assistantPendingTop);
      console.log('[Assistant] render complete (needs-info branch)');
      return;
    }
    if(extractOwnProductPattern(event)){
      usedDay1Texts = new Set();
      const angles = composeDay1AngleSet(buildOwnProductAngles(event));
      console.log('[Assistant] result ready (own-product):', angles);
      document.getElementById('assistantResult').innerHTML = renderThreeAngles(ctx, angles, materialTip(event));
      console.log('[Assistant] render complete');
      return;
    }
    usedAngleKeys.clear();
    regenPass = 0;
    expandedAngleKey = null;
    const keys = pickThreeAngleKeys(event);
    const angles = composeAngleSet(event, ctx, keys);
    console.log('[Assistant] result ready:', angles);
    document.getElementById('assistantResult').innerHTML = renderThreeAngles(ctx, angles, materialTip(event));
    console.log('[Assistant] render complete');
  }catch(err){
    console.error('[Assistant Generation Error]', err);
    const container = document.getElementById('assistantResult');
    if(container){
      container.innerHTML = `
      <div class="card" style="text-align:center;">

function regenerateAngles(){
  const btn = document.getElementById('regenAngleBtn');
  if(btn){ btn.disabled = true; btn.textContent = '✨ 正在幫你找靈感…'; }
  setTimeout(()=>{
    try{
      const p = myPartner();
      if(!p || !assistantPendingEvent) throw new Error('missing partner or pending event');
      const container = document.getElementById('assistantResult');
      if(!container) throw new Error('missing assistantResult container');
      if(isDay1(p)){
        const templates = pickDay1Templates(assistantPendingEvent, p);
        const angles = composeDay1AngleSet(templates);
        const ctx = buildAssistantContext(p, assistantPendingEvent);
        container.innerHTML = renderThreeAngles(ctx, angles, '今天只要願意重新發一則，就已經很足夠了。');
        return;
      }
      if(extractOwnProductPattern(assistantPendingEvent)){
        const ctx = buildAssistantContext(p, assistantPendingEvent);
        const angles = composeDay1AngleSet(buildOwnProductAngles(assistantPendingEvent));
        container.innerHTML = renderThreeAngles(ctx, angles, materialTip(assistantPendingEvent));
        return;
      }
      const ctx = buildAssistantContext(p, assistantPendingEvent);
      regenPass++;
      expandedAngleKey = null;
      const keys = pickThreeAngleKeys(assistantPendingEvent);
      const angles = composeAngleSet(assistantPendingEvent, ctx, keys);
      container.innerHTML = renderThreeAngles(ctx, angles, materialTip(assistantPendingEvent));
    }catch(e){
      const btn2 = document.getElementById('regenAngleBtn');

/* 判斷一句輸入裡是不是包含多件事情（換行或頓號/逗號分隔），拆成獨立素材 */
function splitEventItems(text){
  const t = (text||'').trim();
  if(!t) return [];
  let parts = t.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1){
    parts = t.split(/[、,，;；]/).map(s=>s.trim()).filter(Boolean);
  }
  return parts.length ? parts : [t];
}
const TRANSACTIONAL_CATEGORIES = ['order','product','customer'];
function scoreEventItem(item, ctx){
  const category = classifyEventCategory(item);
  let score = CATEGORY_VALUE_SCORE[category] || 1;
  const detailed = hasStoryDetail(item);
  if(TRANSACTIONAL_CATEGORIES.includes(category) && !detailed){
    score -= 2; // 只有交易事實、沒有故事資訊時，不該天生比生活素材珍貴
  }
  if(hasProductSignal(item) && detailed) score += 1;
  if(/\d/.test(item)) score += 1;
  if(ctx.sharingTags && ctx.sharingTags.some(tag=>item.includes(tag))) score += 1;
  if(isLowSignalEvent(item)) score -= 2;
  // 重啟期／建立期的目標是先穩定出現、建立生活感，不是每天都導向成交
  if((ctx.stage==='重啟期'||ctx.stage==='建立期') && ['family','daily','emotion'].includes(category)){
    score += 1;
  }
  return {item, category, score, detailed};
}

let assistantPendingTop = null;
let assistantPendingRest = [];
function generateMultiMaterialResult(p, items){
  const ctx = buildAssistantContext(p, items.join('、'));
  const scored = items.map(it=>scoreEventItem(it, ctx)).sort((a,b)=>b.score-a.score);
  const top = scored[0];
  const rest = scored.slice(1);
  if(TRANSACTIONAL_CATEGORIES.includes(top.category) && !top.detailed){
    assistantPendingTop = top;
    assistantPendingRest = rest.map(r=>r.item);
    return {kind:'needsInfo', top, restItems: assistantPendingRest};
  }
  return buildMaterialResult(ctx, top, rest.map(r=>r.item), '');
}
function buildMaterialResult(ctx, top, restItems, extraDetail){
  const eventText = extraDetail ? `${top.item}（${extraDetail}）` : top.item;
  const detailed = !!extraDetail || top.detailed;
  const variants = detailed
    ? (CATEGORY_VARIANTS[top.category]||CATEGORY_VARIANTS.daily)(eventText, restItems)
    : buildNeutralTransactionVariants(top.item, restItems);
  const reason = detailed
    ? (CATEGORY_REASON[top.category]||CATEGORY_REASON.daily)
    : (CATEGORY_REASON_NEUTRAL[top.category]||CATEGORY_REASON_NEUTRAL.product);
  const worthwhile = it => !isLowSignalEvent(it);
  const B = restItems.filter(worthwhile);
  const C = restItems.filter(it=>!worthwhile(it));
  return {
    kind:'multi', top:{item:top.item, category:top.category}, reason, variants,
    recommend:{
      format: isLowSignalEvent(top.item) ? '限時動態就好' : '限時動態（也可以之後整理成貼文）',
      scene: CATEGORY_SCENE[top.category]||CATEGORY_SCENE.daily,
      caption: variants[0].text,
      interaction: CATEGORY_INTERACTION[top.category]||null
    },
    B, C, expressionStyle: ctx.expressionStyle
  };
}

/* ===================== 個人定位產生器（引導式選擇，不用自己憑空寫） ===================== */
function resolveOthers(arr, customText){
  if(!arr) return [];
  return arr.map(v=> v==='其他' && customText ? customText : v).filter(v=>v && v!=='其他');
}
function generatePositioning(pf, s5, hc){
  const traits = resolveOthers(s5.traits, s5.traitsOther);
  const sharing = resolveOthers(s5.sharing, s5.sharingOther);
  const storyRaw = s5.story||'';
  const story = s5.storyConsent ? storyRaw : ''; // 私人經歷未經同意，不自動排進公開發文題目
  const audienceListRaw = resolveOthers(s5.audience, s5.audienceOther);
  const audienceList = audienceListRaw.filter(a => a !== '還不知道');
  const audienceUndecided = audienceList.length === 0;
  const audience = audienceList.length ? audienceList.join('、') : '跟你很像的人';
  const benefitList = resolveOthers(s5.benefit, s5.benefitOther);
  const sharingText = sharing.join('、') || '生活日常';
  const traitText = traits.join('、') || '真誠又努力';
  const job = pf.job || '目前這份經營';
  const lifeRole = (pf.lifeRole||'').split('、')[0] || audienceList[0] || '認真生活的人';

  const routeParts = [`真實${lifeRole}生活`];
  if(sharing[1]) routeParts.push(sharing[1]); else if(sharing[0]) routeParts.push(sharing[0]);
  routeParts.push(story ? '成長改變' : '陪伴分享');
  const routeLabel = routeParts.join(' × ');

  const isTentativeStage = hc && (hc.stage==='重啟期' || hc.stage==='建立期');
  const summary = isTentativeStage
    ? `你目前最值得先測試看看的方向，是「${routeLabel}」這條路線。不需要把自己包裝得很厲害，你的優勢反而是${traitText}，可以先從這裡試試看，之後也可以再慢慢調整。`
    : `你適合走「${routeLabel}」的路線。不需要把自己包裝得很厲害，你的優勢反而是${traitText}，而且正在經歷很多${audience}也正在經歷的生活。`;

  const pillars = [
    {
      name:'我的真實生活',
      line:`分享你的${sharingText}，讓大家先認識真實的你。`,
      examples: (sharing.length?sharing:['日常生活']).slice(0,3).map(s=>`分享一則關於「${s}」的生活片段`)
    },
    {
      name:'我的故事與改變',
      line: story ? `分享「${story.slice(0,20)}」這段故事，讓人從你的經歷產生共鳴。` : `分享你這段時間的改變與心情，讓人有共鳴。`,
      examples:[
        story ? `說說「${story.slice(0,18)}」發生的那個轉捩點` : `分享一個讓你印象深刻的轉變時刻`,
        `一次很想放棄、後來怎麼撐過去的心情`
      ]
    },
    {
      name:'我正在學習／使用／經營的事',
      line:`分享你在${job}上正在學習、使用或經營的事，讓${audience}看到你的累積與用心，而不是直接推銷。`,
      examples:[
        `分享一個你正在學習、使用或經營的東西的真實心得`,
        `一個${audience}常問你的問題與你的回答`
      ]
    }
  ];

  const audienceDisplay = audienceUndecided ? null : audience;
  const audienceLine = audienceUndecided
    ? `這 30 天先開始分享，系統會從你比較常分享的內容、互動與回覆中，陪你慢慢找到真正容易跟你產生共鳴的人。`
    : (benefitList.length
      ? `${audience}容易留下來，不是因為你很會賣東西，而是因為她們從你身上感覺到「${benefitList.join('、')}」，覺得「妳跟我好像」。`
      : `${audience}容易留下來，不是因為你很會賣東西，而是因為她們覺得「妳跟我好像」。`);
  const audienceExpandNote = audienceUndecided ? '' : '目前其他受眾還不需要急著定義，先從你最有感覺的人開始。這 30 天會透過你的內容與互動，慢慢幫你看見還有哪些人容易被你吸引。';

  const topics = [
    `一則關於「${sharing[0]||'今天的生活'}」的分享`,
    `你決定重新開始經營自己的原因`,
    `一個朋友常說你「${traits[0]||'很有行動力'}」的小故事`,
    story ? `你從「${story.slice(0,18)}」到現在的轉變` : `一個你最近的小成長或小突破`,
    `寫給${audience}的一句鼓勵`
  ];

  const sList = sharing.join('|');
  const label = sList.includes('健康管理')||sList.includes('保養變美') ? '真實蛻變分享型'
    : sList.includes('家庭育兒') ? '真實生活陪伴型'
    : (sList.includes('上班生活')||sList.includes('工作事業')) ? '真實職場分享型'
    : (sList.includes('穿搭')||sList.includes('美食')||sList.includes('旅遊')) ? '真實生活風格型'
    : '真實生活分享型';
  const traitsLine = traits.length ? traits.join(' × ') : '真誠 × 努力';
  const contentDirections = (sharing.length?sharing:['日常生活']).slice(0,3);
  const shareStyleLines = [
    '你不用刻意把自己變成老師，也不用每天講產品。',
    `從自己的${sharingText}、${story?'改變':'生活'}和實際使用經驗開始分享，反而更容易讓${audience}相信你。`
  ];

  // STEP5 與 STEP6 共用同一組 pillars，pillar[0] 用她實際勾選的分享主題當標題，確保兩頁資料一致、且一定有3個方向
  pillars[0].name = contentDirections.join('／');

  const TRAIT_TYPE_MAP = {
    '幽默':'輕鬆幽默型', '親切':'親切陪伴型', '直率':'真實直球型', '溫柔':'溫柔共感型',
    '專業':'專業分享型', '很會聊天':'聊天互動型', '很會照顧人':'暖心陪伴型',
    '有行動力':'行動帶領型', '真實、不做作':'真實生活型'
  };
  let expressionStyleLabel = '真實自然型';
  for(const t of traits){ if(TRAIT_TYPE_MAP[t]){ expressionStyleLabel = TRAIT_TYPE_MAP[t]; break; } }

  const TRAIT_STYLE_HINTS = {
    '幽默':'輕鬆、有梗、生活化', '溫柔':'細膩、有陪伴感', '直率':'簡單直接、不繞圈',
    '專業':'知識整理與專業分享', '很會聊天':'互動、問答、對話型', '真實、不做作':'真實生活與心得型',
    '親切':'溫暖、貼近生活', '有行動力':'直接、行動導向', '很會照顧人':'陪伴、關心他人的語氣'
  };
  const styleWords = Array.from(new Set(traits.map(t=>TRAIT_STYLE_HINTS[t]).filter(Boolean)));
  const expressionStyle = styleWords.length
    ? `你的內容不用太正式，你比較適合用${styleWords.join('、')}的方式分享。`
    : `你的內容不用太正式，用你自己說話的方式分享就好，反而最真實。`;

  return {summary, pillars, audience, audienceDisplay, audienceUndecided, audienceLine, audienceExpandNote, topics, label, traitsLine, contentDirections, shareStyleLines, expressionStyle, expressionStyleLabel};
}

const TIME_LEVELS = ['30分鐘內','30～60分鐘','1～2小時','2小時以上'];
function scaleAction(base, level){
  if(level<=0) return base;
  if(level===1) return base + '，記得搭配一張屬於你自己的照片或畫面。';
  if(level===2) return base + '，完成後主動關心／回覆 2 位互動過的人。';
  return base + '，完成後主動關心 3 位互動過的人，並簡單記錄你們聊到的重點，方便之後跟進。';
}

const STAGE_BASE_KINDS = {
  '重啟期': ['rhythm','reappear','habit','reengage'],
  '建立期': ['positioning','getknown','pillars','trust'],
  '成長期': ['interact','inquiry','chat','followup'],
  '互動期': ['chat','trust','close','followup'],

};
/* 依最弱環節微調每週訓練重點（沿用同一批內容庫，但同階段的不同使用者會拿到不同的每日內容） */
function pickWeekKinds(stage, weakest){
  const kinds = (STAGE_BASE_KINDS[stage] || STAGE_BASE_KINDS['建立期']).slice();
  if(weakest.includes('exposure') && stage!=='重啟期') kinds[0]='adjust';
  if(weakest.includes('content') && stage!=='重啟期') kinds[0]='positioning';
  if(weakest.includes('positioning')) kinds[1]='positioning';
  if(weakest.includes('inquiry') && stage!=='成長期') kinds[2]='trust';
  if(weakest.includes('closing')) kinds[2]='chat';
  if(weakest.includes('followUp')) kinds[3]='followup';
  return kinds;
}

function buildIdeaCandidates(ctx){
  const list = [];
  (ctx.sharingList.length?ctx.sharingList:['日常生活']).forEach(s=> list.push(`挑一件今天跟「${s}」有關的小事，簡單分享一下`));
  ctx.pillars.forEach(pl=> (pl.examples||[]).forEach(e=> list.push(e)));
  if(ctx.story) list.push(`聊聊「${ctx.story.slice(0,20)}」這段故事的一部分`);
  list.push(`寫一句話，說給${ctx.audience}聽`);
  list.push(`分享你在${ctx.job}上的一個小心得`);
  (ctx.audienceList.length?ctx.audienceList:[]).forEach(a=> list.push(`想一想${a}最近可能遇到的困擾，分享你的觀察`));
  (ctx.changeGoals||[]).forEach(g=>{ if(CHANGE_GOAL_IDEAS[g]) list.push(CHANGE_GOAL_IDEAS[g]); });
  if(ctx.need && NEED_IDEAS[ctx.need]) list.push(NEED_IDEAS[ctx.need]);
  return Array.from(new Set(list));
}
function dailyIdeas(candidates, day){
  if(candidates.length===0) return [];
  const n = candidates.length;
  const start = ((day-1)*2) % n;
  const picked = [];
  for(let i=0;i<3 && i<n;i++) picked.push(candidates[(start+i)%n]);
  return picked;
}

    job: p.profile.job || '你熟悉的領域',
    story: (p.step5 && p.step5.storyConsent && p.step5.story) || '',
    traits: (p.step5 && p.step5.traits) || [],
    changeGoals: p.changeGoals || [],
    need: (p.step2 && p.step2.need) || '',
    lifeRoleLabel: ((p.profile.lifeRole||'').split('、')[0]) || (resolveOthers((p.step5&&p.step5.audience)||[], p.step5&&p.step5.audienceOther)[0]) || '你'
  };
  const candidates = buildIdeaCandidates(ctx);

  const hc = p.healthCheck;
  const realWeakest = (hc.weakest && hc.scores && hc.scores[hc.weakest[0]]>0) ? hc.weakest : [];
  const kinds = pickWeekKinds(stage, realWeakest);
  const ranges = [[1,7],[8,14],[15,21],[22,30]];

  const weeks = [];
  const flat = [];
  WEEK_SLOTS.forEach((slot,idx)=>{
    const range = ranges[idx];
    const pool = (POOL_BUILDERS[kinds[idx]] || POOL_BUILDERS['adjust'])(ctx);
    const days = [];
    for(let day=range[0]; day<=range[1]; day++){
      const item = pool[(day-range[0]) % pool.length];
      const entry = {day, week:slot.no, weekTitle:slot.title, theme:item.theme, why:item.why, action:scaleAction(item.base, level), ideas: dailyIdeas(candidates, day)};
      days.push(entry);
      flat.push(entry);
    }
    weeks.push({no:slot.no, title:slot.title, intro:slot.intro, range, days});
  });

  return {mainline: PLAN_MAINLINE, weeks, flat};
}

function route(){

function render(){
  if(!state.loaded){ document.getElementById('app').innerHTML = loadingScreen(); return; }
  const {name, parts} = route();
  // 已完成設定的回訪使用者，即使網址停在 #/welcome（例如瀏覽器記住上次的網址、或書籤），
  // 也要自動導向自己的 today 頁面，不能再看到「第一次使用」的入口頁
  if(name==='welcome'){
    const p = myPartner();
    if(p && p.plan){
      location.hash = `#/partner/${p.id}/today`;
      return;
    }
  }
  let html = '';
  switch(name){
    case 'welcome': html = viewWelcome(); break;
    case 'settings': html = viewSettings(); break;
    case 'new': html = viewWizard(null); break;
    case 'edit': html = viewWizard(parts[1]); break;

    default: {

      html = (p && p.plan) ? viewPartnerHub(p.id, 'today') : viewWelcome();
    }
  }
  document.getElementById('app').innerHTML = html;
  bindEvents();
  window.scrollTo(0,0);

/* 補齊舊版資料缺少的欄位，避免編輯舊資料時畫面壞掉 */
function normalizeWizardData(d){
  d.profile = Object.assign({jobList:[], jobOther:'', job:'', lifeRoleList:[], lifeRoleOther:'', lifeRole:'', dailyTime:''}, d.profile||{});
  if(!Array.isArray(d.profile.jobList)) d.profile.jobList = d.profile.job ? [d.profile.job] : [];

  if(d.healthCheck) normalizeHealthCheck(d.healthCheck);

function viewWizard(editId){
  if(!wizard.data || wizard._editId!==editId){
    let draft = null;
    if(wizardDraftRaw){
      try{
        const parsed = JSON.parse(wizardDraftRaw);
        if((parsed.editId||null)===(editId||null)) draft = parsed;
      }catch(e){}
    }
    if(draft){
      wizard = {step: draft.step||1, data: normalizeWizardData(draft.data), _editId: editId};
    } else if(editId){
      wizard = {step:1, data: normalizeWizardData(JSON.parse(JSON.stringify(getPartner(editId)))), _editId: editId};
    } else {
      wizard = {step:1, data: freshWizardData(), _editId: null};

    `<div class="wizard-dot ${i<wizard.step?'filled':''} ${i===wizard.step?'active':''}"></div>`).join('');

  let body = '';
  if(wizard.step===1) body = stepBasic(d);

  return topbar('找到適合你的經營方式', `STEP ${wizard.step}｜${STEP_LABELS[wizard.step-1]}（${wizard.step}/${total}）`, true) + `

    <div class="wizard-steps">${stepsHtml}</div>
    ${body}
  </div>`;
}

function readChipGroups(container){
  const result = {};
  container.querySelectorAll('[data-group]').forEach(g=>{
    const active = g.querySelector('.radio-chip.active');
    result[g.dataset.group] = active ? active.dataset.value : '';
  });
  return result;
}
function readMultiGroups(container){
  const result = {};
  container.querySelectorAll('[data-multigroup]').forEach(g=>{
    result[g.dataset.multigroup] = Array.from(g.querySelectorAll('.radio-chip.active')).map(b=>b.dataset.value);
  });
  return result;
}

function wizardNextFrom(step){
  saveWizardStepInputs(step);
  wizard.step = Math.min(6, step+1);
  saveWizardDraft();
  render();
}
function wizardNext(){
  wizard.step = Math.min(6, wizard.step+1);
  saveWizardDraft();
  render();
}
function wizardBack(){
  saveWizardStepInputs(wizard.step);
  wizard.step = Math.max(1, wizard.step-1);
  saveWizardDraft();
  render();
}
function saveWizardStepInputs(step){
  const d = wizard.data;
  const app = document.getElementById('app');
  const chips = readChipGroups(app);
  const multi = readMultiGroups(app);
  if(step===1){
    d.nickname = val('f_nickname') || d.nickname;
    d.profile.jobList = multi.job || d.profile.jobList;
    d.profile.jobOther = val('f_jobOther');
    d.profile.job = resolveOthers(d.profile.jobList, d.profile.jobOther).join('、');
    d.profile.lifeRoleList = multi.lifeRole || d.profile.lifeRoleList;
    d.profile.lifeRoleOther = val('f_lifeRoleOther');
    d.profile.lifeRole = resolveOthers(d.profile.lifeRoleList, d.profile.lifeRoleOther).join('、');
    d.profile.dailyTime = chips.dailyTime || d.profile.dailyTime;
  } else if(step===2){
    d.step2.feeling = chips.feeling || d.step2.feeling;
    d.step2.need = chips.need || d.step2.need;
    d.step2.blockers = multi.blockers || d.step2.blockers;
  } else if(step===3){
    Object.assign(d.step3, chips);
  } else if(step===4){
    d.changeGoals = multi.changeGoals || d.changeGoals;
  } else if(step===5){
    d.step5.traits = multi.traits || d.step5.traits;
    d.step5.sharing = multi.sharing || d.step5.sharing;
    d.step5.audience = multi.audience || d.step5.audience;
    d.step5.benefit = multi.benefit || d.step5.benefit;
    d.step5.traitsOther = val('f_traitsOther');
    d.step5.sharingOther = val('f_sharingOther');
    d.step5.audienceOther = val('f_audienceOther');
    d.step5.benefitOther = val('f_benefitOther');
    d.step5.story = val('f_story');
    const consentBtn = document.getElementById('f_storyConsentBtn');
    if(consentBtn) d.step5.storyConsent = consentBtn.classList.contains('done');
  }
}

async function wizardFinish(){
  const d = wizard.data;
  const existingIdx = state.partners.findIndex(p=>p.id===d.id);
  if(existingIdx>=0){
    // 保留現有的每日紀錄／週回顧／週調整，避免編輯期間累積的最新紀錄被舊的精靈草稿覆蓋掉
    const existing = state.partners[existingIdx];
    d.daily = (existing.daily && typeof existing.daily==='object') ? existing.daily : (d.daily||{});
    d.weeklyRetros = Array.isArray(existing.weeklyRetros) ? existing.weeklyRetros : (d.weeklyRetros||[]);
    d.weekAdjustments = (existing.weekAdjustments && typeof existing.weekAdjustments==='object') ? existing.weekAdjustments : (d.weekAdjustments||{});
    state.partners[existingIdx] = d;
  } else {
    state.partners.push(d);

  await saveData();
  await saveCurrentId(d.id);
  wizard = {step:1, data:null, _editId:null};
  await storageSetRaw('jerosse_wizard_draft', '');
  wizardDraftRaw = null;

}

/* ===================== 我的方向：真正動態的內容方向建議（不寫死任何職業/角色） ===================== */
function extractContentIdentity(p){
  const profile = (p && p.profile) || {};
  const jobTokens = String(profile.job||'').split('、').map(s=>s.trim()).filter(Boolean);
  const lifeTokens = String(profile.lifeRole||'').split('、').map(s=>s.trim()).filter(Boolean);
  const MOM_WORDS = ['媽媽','育兒','孕','人妻','寶媽'];
  const isMomWord = t => MOM_WORDS.some(w=>t.includes(w));
  const momToken = [...jobTokens, ...lifeTokens].find(isMomWord) || '';
  const professionToken = jobTokens.find(t=>!isMomWord(t)) || jobTokens[0] || '你現在的工作';
  const IDENTITY_WORDS = ['斜槓族','創業者'];
  const identityToken = lifeTokens.find(t=>IDENTITY_WORDS.includes(t)) || (lifeTokens.find(t=>!isMomWord(t)&&t!=='其他') || '你');
  const lifeRoleLabel = momToken || lifeTokens.find(t=>!IDENTITY_WORDS.includes(t)&&t!=='其他') || lifeTokens[0] || professionToken;
  return { professionToken, momToken, identityToken, lifeRoleLabel, isMom: !!momToken };
}

function hasGapReturn(p, date){
  const keys = Object.keys(p.daily).filter(k=>k<date).sort();
  if(keys.length===0) return false;
  const last = keys[keys.length-1];
  const diff = Math.floor((new Date(date)-new Date(last))/86400000);
  return diff>=2;
}

function getRecentMoodTrend(p, date){
  let lowStreak = 0;
  for(let i=1;i<=3;i++){
    const dt = new Date(date+'T00:00:00'); dt.setDate(dt.getDate()-i);
    if(dt < new Date(p.startDate+'T00:00:00')) break;
    const key = localDateStr(dt);
    const rec = p.daily[key];
    const isLow = !rec || !dayVisited(rec) || rec.mindsetCheckin==='😔';
    if(isLow) lowStreak++; else break;
  }
  if(lowStreak>=2) return 'light';
  const y = new Date(date+'T00:00:00'); y.setDate(y.getDate()-1);
  const yRec = p.daily[localDateStr(y)];
  if(yRec && yRec.mindsetCheckin==='😔') return 'light';
  if(yRec && (yRec.mindsetCheckin==='😄'||yRec.mindsetCheckin==='🔥')) return 'plus';
  return 'normal';
}

function recentExecutionInfo(p, date){
  const dn = dayNumber(p.startDate);
  let visited=0, total=0;
  for(let n=Math.max(1,dn-6); n<=dn; n++){
    const key = dateOfDay(p.startDate, n);
    total++;
    if(dayVisited(p.daily[key])) visited++;
  }
  return {visited, total};
}

/* ===================== 共用：展開式互動時保持畫面捲動位置不動 =====================
   做法：記錄容器目前在視窗中的 top，更新內容後，用 scrollBy 補回位移差，
   而不是單純回到某個 scrollY，因為容器本身也可能因為上方內容變化而移動。
   容器節點本身不會被整個銷毀重建（只換其 innerHTML），所以量測基準是穩定的。 */
function preserveScrollAround(containerEl, updateFn){
  if(!containerEl){ updateFn(); return; }
  const before = containerEl.getBoundingClientRect().top;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  updateFn();
  const correct = ()=>{
    const after = containerEl.getBoundingClientRect().top;
    const diff = after - before;
    if(diff) window.scrollBy(0, diff);
  };
  requestAnimationFrame(()=>{
    correct();
    requestAnimationFrame(correct);
  });
}

function weekDateRange(week){ const start=(week-1)*7+1; const end=Math.min(week*7,30); return [start,end]; }
function computeWeekSnapshot(p, week){
  const [start,end] = weekDateRange(week);
  let daysVisited=0; const moodCounts={}; const stuckSet=new Set();
  for(let n=start;n<=end;n++){
    const key = dateOfDay(p.startDate, n);
    const rec = p.daily[key];
    if(!rec) continue;
    if(dayVisited(rec)) daysVisited++;
    if(rec.mindsetCheckin) moodCounts[rec.mindsetCheckin]=(moodCounts[rec.mindsetCheckin]||0)+1;
    if(rec.stuckOptionId){
      const opt = STUCK_OPTIONS.find(o=>o.id===rec.stuckOptionId);
      if(opt) stuckSet.add(opt.label);
    }
  }
  let topMood=null, topCount=0;
  Object.entries(moodCounts).forEach(([m,c])=>{ if(c>topCount){ topCount=c; topMood=m; } });
  return { daysVisited, topMoodLabel: topMood?MOOD_LABEL_MAP[topMood]:null, stuckLabels: Array.from(stuckSet) };
}

    <p style="font-size:14px; line-height:2; color:var(--dark);">
      你回來了 ${snap.daysVisited} 天${snap.topMoodLabel?`<br>你最常出現的心情：${snap.topMoodLabel}`:''}${snap.stuckLabels.length?`<br>你曾經卡在：${snap.stuckLabels.join('、')}`:''}
    </p>
  </div>`:''}
  <div class="card">
    ${open?'':`<button class="btn btn-primary" onclick="toggleRetroSurvey('${p.id}')">🤍 陪我看看這一週</button>`}
    ${open?renderRetroSurvey(nextFocusOptions):''}
  </div>
  ${(Array.isArray(p.weeklyRetros)?p.weeklyRetros:[]).slice().reverse().map(r=>renderRetroCard(r)).join('')}`;
}

function renderRetroSurvey(nextFocusOptions){
  return `
    <div class="section-label">這週有哪一件事，是你覺得自己做得還不錯的？（可複選）</div>
    ${multiChipGroup('wentWell', ['我有重新出現','我有分享生活','我有發產品','我有跟人互動','我有回訪客人','我只是沒有完全放棄','其他'], [])}
    ${otherInput('f_reviewWentWellOther','wentWell','','如果選了「其他」，可以簡單寫一下', false)}
    <div class="divider"></div>
    <div class="section-label">這週什麼事情最容易讓你卡住？（可複選，最多 2 個）</div>
    ${multiChipGroup('stuck', ['不知道發什麼','覺得沒人看','不知道怎麼分享產品','不敢主動聊天','有人詢問但不知道怎麼回','沒有成交','沒有時間','很累／沒有動力','其他'], [], 2, '先選這週最卡的2件事就好 🤍')}
    ${otherInput('f_reviewStuckOther','stuck','','如果選了「其他」，可以簡單寫一下', false)}
    <div class="divider"></div>
    <div class="section-label">這週有沒有一個小小的改變？</div>
    <textarea id="f_reviewChange" placeholder="例如：以前完全不想發，這週至少發了兩次。"></textarea>
    <button type="button" class="btn btn-outline" style="margin-top:8px;" onclick="document.getElementById('f_reviewChange').value='我現在還想不到，也沒關係'">我現在還想不到，也沒關係</button>
    <div class="divider"></div>
    <div class="section-label">下週你最想讓哪件事情變得容易一點？</div>
    ${chipGroup('nextFocus', nextFocusOptions, '')}
    <button class="btn btn-primary" style="margin-top:14px;" onclick="generateWeeklyReview()">產生我的本週回顧</button>
  `;
}

function renderRetroCard(r){
  return `
  <div class="retro-block">
    <h4>這週的你 🤍</h4>
    <p>${r.opening}</p>
    <p style="margin-top:8px;">${r.progressLine}</p>
    ${r.stuckLine?`<p style="margin-top:8px;">${r.stuckLine}</p>`:''}
    ${r.practice && r.practice.length?`
    <div class="divider" style="background:rgba(255,255,255,0.5);"></div>
    <p>所以下週我們先不增加更多事情，只練習：</p>
    ${r.practice.map((t,i)=>`<p style="margin-top:4px;">${['①','②'][i]||'・'} ${t}</p>`).join('')}`:''}
    <div class="divider" style="background:rgba(255,255,255,0.5);"></div>
    <p>${r.closing}</p>
  </div>`;
}

async function generateWeeklyReview(){
  const p = myPartner();
  const app = document.getElementById('app');
  const chips = readChipGroups(app);
  const multi = readMultiGroups(app);
  const wentWell = multi.wentWell || [];
  const stuck = multi.stuck || [];
  const wentWellOther = val('f_reviewWentWellOther');
  const stuckOther = val('f_reviewStuckOther');
  const changeText = val('f_reviewChange');
  const nextFocus = chips.nextFocus || '';

  const dn = dayNumber(p.startDate);
  const week = Math.min(4, Math.ceil(dn/7));
  const snap = computeWeekSnapshot(p, week);

  const wentWellResolved = resolveOthers(wentWell, wentWellOther);
  const stuckResolved = resolveOthers(stuck, stuckOther);

  const wentWellPhrase = wentWell.length ? (WENTWELL_PHRASES[wentWell[0]] || wentWellResolved[0]) : '慢慢往前走';
  const opening = snap.daysVisited===0
    ? '這週比較少回來，也沒關係，願意打開這裡看看，就已經是一種開始。'
    : `你沒有每天都出現，但你已經開始${wentWellPhrase}。`;
  const progressLine = '這週你最大的進步不是發了幾篇，而是「沒有完全離開」。';
  const stuckLine = stuckResolved.length ? `目前比較容易卡住的是：${stuckResolved.join('＋')}。` : '';

  const practiceBullets = [];
  stuck.forEach(s=>{ const info = STUCK_PRACTICE[s]; if(info) practiceBullets.push(info.practice); });
  if(practiceBullets.length===0 && nextFocus) practiceBullets.push(`讓「${nextFocus}」變得容易一點`);
  const practice = Array.from(new Set(practiceBullets)).slice(0,2);

  const closing = '不用突然變得很厲害，我們只是比上週再往前一點點。';

  const retro = {week, wentWell:wentWellResolved, stuck:stuckResolved, change:changeText, nextFocus, opening, progressLine, stuckLine, practice, closing, generatedAt: todayStr()};
  if(!Array.isArray(p.weeklyRetros)) p.weeklyRetros = [];
  const existingIdx = p.weeklyRetros.findIndex(r=>r.week===week);
  if(existingIdx>=0) p.weeklyRetros[existingIdx] = retro; else p.weeklyRetros.push(retro);

  const nextWeek = week+1;
  if(nextWeek<=4){
    p.weekAdjustments = p.weekAdjustments || {};
    const adjustment = {extraIdeas:[], easier:false};
    stuck.forEach(s=>{
      const info = STUCK_PRACTICE[s];
      if(info){
        if(info.extraIdea) adjustment.extraIdeas.push(info.extraIdea);
        if(info.easier) adjustment.easier = true;
      }
    });
    if(adjustment.extraIdeas.length || adjustment.easier) p.weekAdjustments[nextWeek] = adjustment;
  }

  retroSurveyOpen[p.id] = false;
  await saveData();
  showToast('已產生本週回顧');
  render();
}

/* ===================== 事件綁定 ===================== */
function bindEvents(){
  document.querySelectorAll('[data-group] .radio-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const group = btn.closest('[data-group]');
      group.querySelectorAll('.radio-chip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  document.querySelectorAll('[data-multigroup] .radio-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const group = btn.closest('[data-multigroup]');
      const max = parseInt(group.dataset.max||'0',10);
      if(!btn.classList.contains('active') && max>0){
        const activeCount = group.querySelectorAll('.radio-chip.active').length;
        if(activeCount>=max){ showToast(group.dataset.maxMsg || `最多可以選擇 ${max} 個喔 🤍`); return; }
      }
      btn.classList.toggle('active');
      if(btn.dataset.value==='其他'){
        const wrap = document.getElementById('otherwrap_'+group.dataset.multigroup);
        if(wrap) wrap.style.display = btn.classList.contains('active') ? 'block' : 'none';
      }
      const exclusiveVal = group.dataset.exclusive;
      if(exclusiveVal){
        if(btn.dataset.value===exclusiveVal && btn.classList.contains('active')){
          // 選了「還不知道」這類狀態選項 → 清掉其他已選的真實選項
          group.querySelectorAll('.radio-chip').forEach(b=>{ if(b!==btn) b.classList.remove('active'); });
        } else if(btn.dataset.value!==exclusiveVal && btn.classList.contains('active')){
          // 選了真實選項 → 自動取消「還不知道」
          const exBtn = Array.from(group.querySelectorAll('.radio-chip')).find(b=>b.dataset.value===exclusiveVal);
          if(exBtn) exBtn.classList.remove('active');
        }
      }
    });
  });
  const importFile = document.getElementById('importFile');
  if(importFile){
    importFile.addEventListener('change', (e)=>{ if(e.target.files[0]) importData(e.target.files[0]); });
  }
}
</script>
